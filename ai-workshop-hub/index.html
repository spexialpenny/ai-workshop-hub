<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workshop Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Workshop Hub</h1>
      <p>依照 AGENTS.md 規則驅動的生成式 AI 作品庫</p>
    </header>

    <main id="project-grid" class="grid"></main>
  </div>

  <script>
    // 解決本機 file:/// 無法讀取 json 的限制，直接將專案資料內建於此
    const projects = [
      {
        "id": "split-vibe",
        "title": "SplitVibe 旅程分帳與轉盤",
        "category": "Web App",
        "summary": "多人出遊自動平帳，解決誰請客與吃什麼的選擇困難。",
        "tags": ["Vibe Coding", "Canvas"],
        "link": "pages/split-vibe.html",
        "icon": "🎡"
      },
      {
        "id": "code-review",
        "title": "Reflection 程式自我審查 Agent",
        "category": "AI Agent",
        "summary": "由 AI 自動反省程式碼邊界漏洞並重構高強韌度版本。",
        "tags": ["Reflection", "Gradio"],
        "link": "pages/template.html",
        "icon": "🤖"
      },
      {
        "id": "custom-boss",
        "title": "主管老陳職場壓力對話模擬器",
        "category": "LLM App",
        "summary": "刀子嘴豆腐心的實習主管，先吐槽再給出具體改進步驟。",
        "tags": ["AI Suite", "Groq API"],
        "link": "pages/template.html",
        "icon": "👔"
      }
    ];

    // 動態繪製卡片
    const grid = document.getElementById('project-grid');
    grid.innerHTML = projects.map(item => `
      <a href="${item.link}" class="card">
        <div class="card-icon">${item.icon}</div>
        <div class="card-title">${item.title}</div>
        <div class="card-desc">${item.summary}</div>
        <div class="card-tags">
          ${item.tags.map(t => `<span class="tag">${t}</span>`).join(' ')}
        </div>
      </a>
    `).join('');
  </script>
</body>
</html>
